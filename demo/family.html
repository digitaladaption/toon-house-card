<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toon House Card: family calendar and chores demo</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/toon.css">
<style>
  body{margin:0;padding:12px;min-height:100vh}
  #tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  #host{max-width:1300px}
</style>
</head>
<body class="toon">
<div id="host"></div>
<script type="module">
  // A stand-in for Home Assistant: made-up people, calendars and to-do lists, kept in this page only.
  import "../dist/toon-house-card.js";
  const q = new URLSearchParams(location.search);
  const people = [
    { name: "Mum", look: "mum", calendar: ["calendar.mum", "calendar.mum_work"] }, { name: "Dad", look: { type: "dad", glasses: true }, calendar: "calendar.dad" },
    { name: "Mia", look: "girl", calendar: "calendar.mia", chores: "todo.mia_chores", stars: "counter.mia_stars" }, { name: "Baby Jo", look: "baby", chores: "todo.jo_chores", stars: "counter.jo_stars" },
  ];
  const now = new Date(), mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7));
  const at = (d, h, m = 0) => new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + d, h, m).toISOString();
  const day = (d) => { const x = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`; };
  const timed = (summary, d, h, m, mins = 60) => ({ summary, start: { dateTime: at(d, h, m) }, end: { dateTime: new Date(new Date(at(d, h, m)).getTime() + mins * 60000).toISOString() } });
  const allDay = (summary, d, n = 1) => ({ summary, start: { date: day(d) }, end: { date: day(d + n) } });
  const cals = {
    "calendar.mum": [timed("Yoga", 0, 18, 30), timed("Dentist", 2, 9, 15, 30), timed("Book club", 3, 19, 30, 90)],
    "calendar.dad": [timed("Five-a-side", 1, 19, 0), timed("Car service", 3, 8, 30, 30), allDay("Working away", 4)],
    "calendar.mia": [timed("Swimming", 0, 16, 0, 45), timed("Brownies", 2, 17, 30), timed("Party at Ava's", 5, 14, 0, 120), allDay("School trip", 3)],
    "calendar.mum_work": [timed("Team meeting", 1, 10, 0)],
    "calendar.birthdays": [allDay("Grandad's birthday", 2)],
    "calendar.family": [allDay("Bin day", 1), timed("Grandma for lunch", 6, 12, 30, 120), allDay("Half term", 5, 2)],
  };
  let uid = 0;
  const item = (summary, done, due) => ({ uid: `i${++uid}`, summary, status: done ? "completed" : "needs_action", ...(due != null ? { due: day(due) } : {}) });
  const todos = {
    "todo.mia_chores": [item("Make my bed", true), item("Feed the cat"), item("Set the table"), item("Tidy my toys")],
    "todo.jo_chores": [item("Put teddy to bed", true), item("Shoes on the rack")],
    "todo.homework": [item("Spellings", false, 2), item("Reading: chapter 3", false, 4), item("Times tables", true, 1)],
  };
  const counters = { "counter.mia_stars": 14, "counter.jo_stars": 6 };
  const states = {}; let tick = 0;
  function rebuild() {
    tick++;
    for (const id of Object.keys(cals)) states[id] = { entity_id: id, state: "off", attributes: { friendly_name: id.split(".")[1], supported_features: 7 } };
    for (const [id, items] of Object.entries(todos)) states[id] = { entity_id: id, state: String(items.filter((i) => i.status !== "completed").length), last_updated: String(tick), attributes: { friendly_name: id === "todo.homework" ? "Mia's homework" : id.split(".")[1], supported_features: 15 } };
    for (const [id, n] of Object.entries(counters)) states[id] = { entity_id: id, state: String(n), attributes: {} };
  }
  window.calls = [];
  const hass = () => ({
    states: { ...states },
    callWS: async (msg) => { if (msg.type === "todo/item/list") return { items: (todos[msg.entity_id] || []).map((i) => ({ ...i })) }; throw new Error("not in the demo"); },
    callApi: async (method, path) => { const m = /^calendars\/([^?]+)\?start=([^&]+)&end=(.+)$/.exec(path); if (!m) throw new Error("not in the demo"); const a = new Date(decodeURIComponent(m[2])), b = new Date(decodeURIComponent(m[3])); const t = (v) => new Date(v.dateTime || `${v.date}T00:00:00`); return (cals[m[1]] || []).filter((e) => t(e.start) < b && t(e.end) > a); },
    callService: async (domain, service, data, target) => {
      const id = target && target.entity_id; window.calls.push({ domain, service, data, id });
      if (domain === "todo") {
        const list = todos[id]; if (!list) throw new Error("no such list");
        if (service === "update_item") { const it = list.find((i) => i.uid === data.item); if (it) it.status = data.status; }
        else if (service === "add_item") list.push(item(data.item));
        else if (service === "remove_item") list.splice(list.findIndex((i) => i.uid === data.item), 1);
      } else if (domain === "counter") counters[id] += service === "increment" ? 1 : -1;
      else if (domain === "calendar" && service === "create_event") cals[id].push(data.start_date ? { summary: data.summary, start: { date: data.start_date }, end: { date: data.end_date } } : { summary: data.summary, start: { dateTime: new Date(data.start_date_time.replace(" ", "T")).toISOString() }, end: { dateTime: new Date(data.end_date_time.replace(" ", "T")).toISOString() } });
      rebuild(); card.hass = hass();
    },
  });
  // the tabs each card can show; on this page they lead to the demo pages
  const LINKS = [{ name: "House", path: "./index.html", icon: "house" }, { name: "Calendar", path: "./family.html?tab=calendar", icon: "calendar" }, { name: "Chores", path: "./family.html?tab=chores", icon: "star" }];
  let card;
  function show(tab) {
    if (card) card.remove();
    card = document.createElement(tab === "chores" ? "toon-chores-card" : "toon-calendar-card");
    card.setConfig(tab === "chores" ? { type: "custom:toon-chores-card", people: people.filter((p) => p.chores), links: LINKS } : { type: "custom:toon-calendar-card", people, calendars: [{ entity: "calendar.family", name: "Everyone" }, { entity: "calendar.birthdays", name: "Birthdays", add: false }], homework: "todo.homework", links: LINKS });
    document.getElementById("host").appendChild(card);
    rebuild(); card.hass = hass(); window.card = card;
  }
  if (!q.get("tab")) history.replaceState(null, "", "?tab=calendar");
  show(q.get("tab") || "calendar");
</script>
</body>
</html>
