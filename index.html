<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toon House Card</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/toon.css">
<style>
  body{display:grid;place-items:center;min-height:100vh;padding:16px}
  main{padding:22px 26px;max-width:560px;width:100%;text-align:center}
  #art{width:150px;margin:0 auto 4px;animation:bob 3s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
  h1{font-size:34px}
  p{font-size:18px;line-height:1.45;margin:8px 0 16px}
  .btn{display:flex;margin:10px 0}
  img{width:100%;border:3px solid var(--ink);border-radius:16px;margin:6px 0 4px;display:block}
  @media (prefers-reduced-motion:reduce){#art{animation:none}}
</style>
</head>
<body class="toon">
<main class="panel">
  <div id="art"></div>
  <h1>Toon House Card</h1>
  <p>Your home as a cartoon 3D house for Home Assistant. Tap the lights, watch the blinds move.</p>
  <a class="btn big go" href="importer/">Build my house from a floor plan</a>
  <a class="btn" href="demo/">Play with the example house</a>
  <a class="btn" href="https://github.com/digitaladaption/toon-house-card">How to install it</a>
  <img src="docs/img/outside.png" alt="A cartoon 3D house with a red roof, garden and drive">
</main>
<script type="module">
  import { roofus } from "./src/importer/art.js";
  document.getElementById("art").innerHTML = roofus("party");
</script>
</body>
</html>
