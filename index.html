<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toon House Card</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#6CCBFA;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#1b1b1b}
  main{background:#FFFDF4;border:3px solid #1b1b1b;border-radius:16px;box-shadow:4px 5px 0 #1b1b1b;padding:24px 28px;max-width:520px;margin:16px}
  h1{margin:0 0 8px;font-size:28px}
  p{font-size:16px;line-height:1.5}
  a.btn{display:block;margin:10px 0;padding:12px 16px;border:3px solid #1b1b1b;border-radius:12px;background:#FFD83A;color:#1b1b1b;font-weight:800;text-decoration:none;box-shadow:2px 3px 0 #1b1b1b}
  a.plain{background:#fff}
</style>
</head>
<body>
<main>
  <h1>Toon House Card</h1>
  <p>A cartoon 3D dollhouse of your home for Home Assistant.</p>
  <a class="btn" href="importer/">Turn a floor plan picture into a house</a>
  <a class="btn plain" href="demo/">See the example house</a>
  <a class="btn plain" href="https://github.com/digitaladaption/toon-house-card">Install guide and source on GitHub</a>
</main>
</body>
</html>
